server {
    listen 80;
    server_name packages.<TON_DOMAINE>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name packages.<TON_DOMAINE>;

    ssl_certificate     /etc/letsencrypt/live/packages.<TON_DOMAINE>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/packages.<TON_DOMAINE>/privkey.pem;

    root /var/www/packages;
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }
}
